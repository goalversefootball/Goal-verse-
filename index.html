<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goal Verse</title><style>*{box-sizing:border-box}body{margin:0;background:#101412;color:#fff;font:16px Arial,sans-serif}header,main,footer{padding:22px;max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px}strong.logo{font-size:30px;letter-spacing:-2px}em{color:#a5f52b;font-style:normal}button,input,select,textarea{font:inherit;padding:12px;border-radius:7px;border:1px solid #435046;background:#202b23;color:white}button{cursor:pointer}button.primary,button.active{background:#a5f52b;color:#101412;font-weight:bold}nav{display:flex;gap:8px;overflow:auto;padding:12px;background:#1b251e}nav button{white-space:nowrap}.hero{background:linear-gradient(120deg,#101412,#285832);padding:50px 22px}.hero h1{font-size:clamp(36px,7vw,65px);margin:12px 0}.ticker{background:#a5f52b;color:#101412;padding:10px 22px;font-size:12px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}article{background:#1b251e;border:1px solid #344238;border-radius:12px;overflow:hidden}article section{padding:18px}.photo{width:100%;height:180px;object-fit:cover;background:#284331;display:grid;place-items:center;font-size:52px}small{color:#a5f52b}p{line-height:1.6;overflow-wrap:anywhere}input,textarea,select{width:100%}form{display:grid;gap:12px;margin:16px 0}label{display:grid;gap:6px}label.check{display:flex;align-items:center}label.check input{width:auto}dialog{background:#1b251e;color:white;border:1px solid #435046;border-radius:12px;width:min(92%,700px);max-height:90vh;overflow:auto;padding:22px}dialog::backdrop{background:#000b}.actions{display:flex;gap:8px;flex-wrap:wrap}.story{white-space:pre-wrap}footer{color:#aaa;text-align:center}#status,#adminStatus{color:#d3e4d5}</style></head><body><header><strong class="logo">GOAL<em>VERSE</em></strong><button id="adminOpen">Newsroom</button></header><div class="ticker">INDEPENDENT FOOTBALL NEWS</div><nav id="nav"></nav><section class="hero"><small>THE BEAUTIFUL GAME</small><h1>Football. Beyond the <em>90.</em></h1><p>Every story. Every league. One destination.</p></section><main><h2>Latest news</h2><input id="search" placeholder="Search football news" aria-label="Search news"><p id="status" role="status"></p><div class="grid" id="news"></div></main><footer>Goal Verse · Your game. Your news. Your world.</footer><dialog id="reader"><button id="closeReader">Close</button><div id="story"></div></dialog><dialog id="admin"><button id="closeAdmin">Close</button><h2>Private newsroom</h2><p id="adminStatus" role="status"></p><form id="login"><label>Email<input type="email" id="email" required autocomplete="username"></label><label>Password<input type="password" id="password" required autocomplete="current-password"></label><button class="primary">Sign in</button></form><section id="workspace" hidden><button id="logout">Sign out</button><form id="editor"><label>Headline<input id="headline" required></label><label>Category<select id="category"></select></label><label>Summary<textarea id="summary"></textarea></label><label>Article<textarea id="content" rows="8" required></textarea></label><label>Photo URL (optional)<input id="image" type="url"></label><label class="check"><input id="published" type="checkbox"> Publish publicly</label><div class="actions"><button class="primary">Save article</button><button type="button" id="reset">New article</button></div></form><h3>Manage articles</h3><div id="manage"></div></section></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);const db=supabase.createClient('https://wfkyzzpjwiyvvnhuemaj.supabase.co','sb_publishable_YLa3GMZiq3g-JaO403wzXQ_d8LrV78D');const owner='768fd52d-5f46-4853-9b4b-9a51c171cd3e';const cats=['All News','Transfers','Premier League','La Liga','Champions League','Saudi Pro League','International'];let selected=cats[0],posts=[],editing=null;function el(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}function photo(p){try{const u=new URL(p.image_url);if(u.protocol==='https:'){const i=el('img',null,'photo');i.src=u.href;i.alt='Article photograph';i.referrerPolicy='no-referrer';return i}}catch{}return el('div','⚽','photo')}function nav(){ $('nav').replaceChildren();cats.forEach(c=>{const b=el('button',c,c===selected?'active':'');b.onclick=()=>{selected=c;nav();render()};$('nav').append(b)})}cats.slice(1).forEach(c=>$('category').append(el('option',c)));function render(){const q=$('search').value.toLowerCase();$('news').replaceChildren();const list=posts.filter(p=>(selected===cats[0]||p.category===selected)&&(p.title+' '+p.content).toLowerCase().includes(q));$('status').textContent=list.length?'':'No published articles found.';list.forEach(p=>{const a=el('article'),s=el('section'),b=el('button','Read more →');b.onclick=()=>{$('story').replaceChildren(photo(p),el('small',p.category),el('h1',p.title),el('p',p.content,'story'));$('reader').showModal()};s.append(el('small',p.category),el('h2',p.title),el('p',p.description||''),b);a.append(photo(p),s);$('news').append(a)})}async function load(){const {data,error}=await db.from('articles').select('*').eq('published',true).order('created_at',{ascending:false});if(error){$('status').textContent=error.message;return}posts=data;render()}$('search').oninput=render;$('closeReader').onclick=()=>$('reader').close();$('closeAdmin').onclick=()=>$('admin').close();function reset(){editing=null;$('editor').reset()}$('reset').onclick=reset;async function refreshAdmin(){const {data:{user}}=await db.auth.getUser();const allowed=user?.id===owner;$('login').hidden=allowed;$('workspace').hidden=!allowed;$('login').style.display=allowed?'none':'grid';if(!allowed)return;const {data,error}=await db.from('articles').select('*').order('created_at',{ascending:false});if(error){$('adminStatus').textContent=error.message;return}$('manage').replaceChildren();data.forEach(p=>{const box=el('section'),a=el('button','Edit'),b=el('button','Delete');a.onclick=()=>{editing=p.id;$('headline').value=p.title;$('category').value=p.category;$('summary').value=p.description||'';$('content').value=p.content;$('image').value=p.image_url||'';$('published').checked=p.published;$('editor').scrollIntoView()};b.onclick=async()=>{if(!confirm('Delete this article?'))return;const {error}=await db.from('articles').delete().eq('id',p.id);$('adminStatus').textContent=error?error.message:'Deleted.';await refreshAdmin();await load()};box.append(el('p',p.title+' — '+(p.published?'Published':'Draft')),a,b);$('manage').append(box)})}$('adminOpen').onclick=()=>{$('admin').showModal();refreshAdmin()};$('login').onsubmit=async e=>{e.preventDefault();const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error){$('adminStatus').textContent=error.message;return}if(data.user.id!==owner){await db.auth.signOut();$('adminStatus').textContent='Not authorized.';return}$('adminStatus').textContent='Signed in.';refreshAdmin()};$('logout').onclick=async()=>{await db.auth.signOut();reset();$('adminStatus').textContent='Signed out.';refreshAdmin()};$('editor').onsubmit=async e=>{e.preventDefault();const p={title:$('headline').value.trim(),category:$('category').value,description:$('summary').value,content:$('content').value,image_url:$('image').value||null,published:$('published').checked};if(!p.title||!p.content.trim())return;if(p.image_url&&!p.image_url.startsWith('https://')){$('adminStatus').textContent='Use an HTTPS photo URL.';return}const {error}=editing?await db.from('articles').update(p).eq('id',editing):await db.from('articles').insert(p);$('adminStatus').textContent=error?error.message:'Article saved.';if(!error){reset();await refreshAdmin();await load()}};nav();load();
</script></body></html>
